<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Egg Timer – Done</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="window">
    <div class="window-bar">
        <span class="window-title">Egg Timer – Done</span>
        <div class="window-icons">
            <img src="assets/8664917_window_minimize_icon.png" alt="minimize" class="icon">
            <img src="assets/211651_close_round_icon.png" alt="close" class="icon">
        </div>
    </div>
    <div class="window-content done-content">
        <h2 class="done-title">Your egg is done!</h2>
        <img id="egg-done" src="assets/egg-done.gif" alt="Egg Done Animation" class="egg-gif" />
        <div class="done-btn-row">
            <!-- Snooze reuses the egg type from the URL param passed by timer.html -->
            <button class="snooze-btn" id="snooze-btn">Snooze</button>
            <button class="close-btn" onclick="window.location.href='index.html'">Close</button>
        </div>
    </div>
</div>
<script>
    var egg = new URLSearchParams(window.location.search).get('egg') || 'soft';
    document.getElementById('snooze-btn').addEventListener('click', function() {
        window.location.href = 'timer.html?egg=' + encodeURIComponent(egg);
    });
</script>
</body>
</html>
