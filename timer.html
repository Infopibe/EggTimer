<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Egg Timer – Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="window">
    <div class="window-bar">
        <span class="window-title">Egg Timer – Timer</span>
        <div class="window-icons">
            <img src="assets/minimize.png" alt="minimize" class="icon">
            <img src="assets/close.png" alt="close" class="icon">
        </div>
    </div>
    <div class="window-content timer-content">
        <h2 id="egg-type-label" class="timer-title"></h2>
        <img id="egg-gif" src="assets/egg-soft.gif" alt="Egg Animation" class="egg-gif" />
        <div class="timer-desc">Your egg is ready in…</div>
        <div class="timer-countdown" id="timer-countdown"></div>
        <button class="btn cancel-btn" onclick="window.location.href='menu.html'">Cancel</button>
        <audio id="timer-sound" src="assets/ding.mp3" preload="auto"></audio>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
