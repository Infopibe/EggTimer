<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Egg Timer – Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="window">
    <div class="window-bar">
        <span class="window-title">Egg Timer – Timer</span>
        <div class="window-icons">
            <img src="assets/8664917_window_minimize_icon.png" alt="minimize" class="icon">
            <img src="assets/211651_close_round_icon.png" alt="close" class="icon">
        </div>
    </div>
    <div class="window-content timer-content">
        <h2 id="egg-type-label" class="timer-title"></h2>
        <img id="egg-gif" src="assets/egg-soft.gif" alt="Egg Animation" class="egg-gif" />
        <div class="timer-desc">Your egg is ready in…</div>
        <div class="timer-countdown" id="timer-countdown">00:00</div>
        <button class="cancel-btn" onclick="window.location.href='menu.html'">Cancel</button>
        <audio id="timer-sound" src="assets/ding.mp3" preload="auto"></audio>
    </div>
</div>
<script>
    var eggs = {
        soft:      { label: 'Soft Boiled Egg',  gif: 'assets/egg-soft.gif',     time: 3 * 60 },
        hard:      { label: 'Hard Boiled Egg',  gif: 'assets/egg-hard.gif',     time: 8 * 60 },
        fried:     { label: 'Fried Egg',        gif: 'assets/egg-fried.gif',    time: 5 * 60 },
        scrambled: { label: 'Scrambled Egg',    gif: 'assets/egg-scramble.gif', time: 7 * 60 }
    };

    var type = new URLSearchParams(window.location.search).get('egg') || 'soft';
    var egg = eggs[type] || eggs['soft'];

    document.getElementById('egg-type-label').textContent = egg.label;
    document.getElementById('egg-gif').src = egg.gif;

    var remaining = egg.time;
    var timerEl = document.getElementById('timer-countdown');
    var sound = document.getElementById('timer-sound');

    function formatTime(s) {
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    timerEl.textContent = formatTime(remaining);

    var interval = setInterval(function() {
        if (remaining > 0) {
            remaining--;
            timerEl.textContent = formatTime(remaining);
        } else {
            clearInterval(interval);
            timerEl.textContent = '00:00';
            sound.play().catch(function() {});
            setTimeout(function() {
                window.location.href = 'done.html?egg=' + encodeURIComponent(type);
            }, 1400);
        }
    }, 1000);
</script>
</body>
</html>
