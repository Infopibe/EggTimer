<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Egg Timer &lt;3</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="window">
    <div class="window-bar">
        <span class="window-title">Egg Timer &lt;3</span>
        <div class="window-icons">
            <img src="assets/minimize.png" alt="minimize" class="icon">
            <img src="assets/close.png" alt="close" class="icon">
        </div>
    </div>
    <div class="window-content">
        <!-- Clouds Layer -->
        <img src="assets/cloud1.png" class="cloud cloud1" alt="cloud">
        <img src="assets/cloud2.png" class="cloud cloud2" alt="cloud">
        <img src="assets/cloud3.png" class="cloud cloud3" alt="cloud">
        <!-- Main Content -->
        <h1 class="start-title">Let’s time<br>your egg!</h1>
        <button class="start-btn" onclick="window.location.href='menu.html'">Start</button>
    </div>
</div>
</body>
</html>
